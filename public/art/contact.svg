    <rect x="480" y="540" width="150" height="210" rx="4"/>
    <rect x="670" y="540" width="150" height="210" rx="4"/>
    <rect x="860" y="540" width="150" height="210" rx="4"/>
    <rect x="1050" y="540" width="150" height="210" rx="4"/>
    <rect x="1240" y="540" width="90" height="210" rx="4"/>
  </g>

  <g fill="#0A0B09" opacity="0.55">
